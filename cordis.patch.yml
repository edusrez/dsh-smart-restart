# dsh bundle patch: inserts this plugin into a profile's layer stack.
- insert:
    - id: smart-restart
      name: dsh-smart-restart
      config:
        enabled: true
        stateDir: .smart-restart
        target: primary
        wakeup: true
        notice: ''
        # systemd unit to restart when the smart_restart tool is invoked
        # (e.g. "dsh.service" or "dsh-deepartments-dev.service"); leave empty
        # to disable restarting and make the tool fail safe.
        restartUnit: ''
        # whether to register the smart_restart tool (default true).
        toolEnabled: true
        # grace window (ms, default 10 min) before shutdown within which last
        # agent activity counts as "agent-involved" for the smart shutdown
        # auto-notification (boot pins to that session instead of `target`).
        shutdownGraceMs: 600000
        # optional canary pre-restart validation (default false): boots an
        # ephemeral DSH instance (same binary/profile as this unit) on a temp
        # free port with a temp state overlay, probes HTTP health, and aborts
        # the restart on failure. The per-call `canary` tool param overrides.
        canary: false
        # hard window (ms) for the canary boot liveness probe (default 45s);
        # a timeout is a canary failure and aborts the restart.
        canaryTimeoutMs: 45000
        # HTTP port for the canary instance (default 0 = auto-pick a free port).
        canaryPort: 0
        # explicit dsh profile/binary for the canary launch (default '' =
        # derive from `systemctl show -p ExecStart` of restartUnit; the binary
        # falls back to `dsh` on PATH).
        canaryProfile: ''
        canaryBinary: ''
        # plugin-row id -> temp dir: those rows get their stateDir redirected
        # in the canary patch so the ephemeral never writes live state
        # (e.g. `deepartments: ''` keeps the canary off live board state).
        canaryStateDirOverrides: {}
