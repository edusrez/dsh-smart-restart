# CI for dsh-smart-restart: compile (tsc) + unit tests (node:test) on every
# push / pull request to main. pnpm is provisioned via pnpm/action-setup and
# the install uses a frozen lockfile so the CI dependency graph matches the
# committed pnpm-lock.yaml exactly.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test